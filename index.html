<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Games</title>
  <link rel="icon" href="reis-party-games-icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="reis-party-games-icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ruthie&display=swap');
    :root {
      --bg-void: oklch(15% 0.02 260);
      --bg-raised: oklch(18% 0.03 260);
      --bg-inset: oklch(20% 0.02 260);
      --border-hairline: oklch(40% 0.02 260 / 0.4);
      --text-primary: oklch(95% 0.01 260);
      --text-secondary: oklch(80% 0.02 260);
      --text-muted: oklch(70% 0.02 260);
      --blue-400: oklch(70% 0.19 255);
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; background: var(--bg-void); color: var(--text-primary);
      font-family: 'Inter', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    main { width: 100%; max-width: 480px; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
    .logo { width: 88px; height: 88px; margin: 0 auto; display: block; }
    h1 { margin: 0; text-align: center; }
    h1 .title { display: block; font-family: 'Ruthie', cursive; font-size: 4rem; color: var(--text-primary); font-weight: 400; letter-spacing: .05em; }
    h1 .subtitle { display: block; font-size: .95rem; color: var(--blue-400); font-weight: 600; letter-spacing: .35em; margin-top: 4px; }
    .game {
      display: block; min-height: 72px; padding: 16px 20px; border-radius: var(--radius-lg);
      background: var(--bg-raised); border: 1px solid var(--border-hairline); color: var(--text-primary);
      text-decoration: none; display: flex; flex-direction: column; justify-content: center; gap: 4px;
      transition: filter .2s;
    }
    .game:hover { filter: brightness(1.15); }
    .game strong { font-size: 1.4rem; }
    .game span { font-size: .95rem; color: var(--text-secondary); }
    .game.soon { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
<main>
  <img class="logo" src="reis-party-games-icon-dark.svg" alt="" width="88" height="88">
  <h1><span class="title">REIS</span><span class="subtitle">PARTY GAMES</span></h1>
  <a class="game" href="mimica/">
    <strong>Mímica</strong>
    <span>8 rodadas, times revezando — quem adivinha mais palavras?</span>
  </a>
  <a class="game" href="ito/">
    <strong>Ito</strong>
    <span>Número secreto de 1 a 100, uma dica cada — em que ordem vocês estão?</span>
  </a>
  <a class="game" href="batata-quente/">
    <strong>Batata Quente</strong>
    <span>Passe o objeto falando itens da categoria — quem segurar quando explodir, sai!</span>
  </a>
</main>
</body>
</html>
